name: CI_CD

on:
  push:
    branches:
      - feature_Automation_CI_CD

jobs:
  Automate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the source code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries (if needed)
        run: |
          # Example: install any Arduino libraries your sketch depends on
          arduino-cli lib install "ArduinoJson"

      - name: Compile Arduino sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 <path-to-your-sketch-folder>

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: ./build/esp32.esp32.esp32/*.bin
