name: CI_CD

on:
  push:
    branches:
      - feature_Automation_CI_CD


jobs:
  Automate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup ESP-IDE
        uses: espressif/esp-idf-ci-action@v1

      - name: Build firmware
        run: |
          idf.py Build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: build/*.bin
        
