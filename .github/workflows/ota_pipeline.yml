name: ESP32 Delta OTA Pipeline

on:
  push:
    branches:
      - feature/docker-env
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Build Firmware
      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: '.'

      # Step 4: Rename using Short Commit Hash
      - name: Rename Build Output
        id: rename-step
        run: |
          # Extract the first 7 characters of the GitHub commit SHA
          CURRENT_HASH="${GITHUB_SHA::7}"
          NEW_FILENAME="build_${CURRENT_HASH}.bin"
          
          echo "Moving and renaming build/wifi_station.bin to ${NEW_FILENAME}..."
          sudo mv build/wifi_station.bin ${NEW_FILENAME}
          sudo chown $USER:$USER ${NEW_FILENAME}
          
          # Save variables for future steps
          echo "current_file=${NEW_FILENAME}" >> $GITHUB_OUTPUT
          echo "current_hash=${CURRENT_HASH}" >> $GITHUB_OUTPUT

      # Step 5: Check S3 and Extract Previous Hash
      - name: Check for Previous Firmware in S3
        id: s3-check
        run: |
          echo "Looking for the latest build_*.bin in the bucket..."
          
          # aws s3 ls starts with the date/time, so 'sort' organizes them chronologically
          LATEST_FILE=$(aws s3 ls s3://esp32-firmware-rewaa/ | grep 'build_.*\.bin$' | sort | tail -n 1 | awk '{print $4}')
          
          if [ -z "$LATEST_FILE" ]; then
            echo "No previous baseline binary found."
            echo "has_previous=false" >> $GITHUB_OUTPUT
          else
            echo "Found previous baseline binary: $LATEST_FILE"
            
            # Use sed to extract the hash between 'build_' and '.bin'
            PREV_HASH=$(echo $LATEST_FILE | sed -E 's/build_(.*)\.bin/\1/')
            echo "Extracted previous hash: $PREV_HASH"
            
            echo "has_previous=true" >> $GITHUB_OUTPUT
            echo "latest_file=$LATEST_FILE" >> $GITHUB_OUTPUT
            echo "prev_hash=$PREV_HASH" >> $GITHUB_OUTPUT
          fi

      # Step 6: First Run - Upload Initial Baseline
      - name: Upload Initial Baseline to S3
        if: steps.s3-check.outputs.has_previous == 'false'
        run: |
          CURRENT_FILE="${{ steps.rename-step.outputs.current_file }}"
          echo "No previous binary found. Uploading ${CURRENT_FILE} as the new baseline..."
          aws s3 cp ${CURRENT_FILE} s3://esp32-firmware-rewaa/

      # Step 7: Setup Python 
      - name: Setup Python
        if: steps.s3-check.outputs.has_previous == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 8: Generate and Upload Patch using Hashes
      - name: Generate and Upload Patch
        if: steps.s3-check.outputs.has_previous == 'true'
        run: |
          # Retrieve variables
          PREV_FILE="${{ steps.s3-check.outputs.latest_file }}"
          PREV_HASH="${{ steps.s3-check.outputs.prev_hash }}"
          
          CURRENT_FILE="${{ steps.rename-step.outputs.current_file }}"
          CURRENT_HASH="${{ steps.rename-step.outputs.current_hash }}"
          
          # Construct the exact patch name requested
          PATCH_NAME="patch_from_${PREV_HASH}_${CURRENT_HASH}.bin"
          
          echo "Downloading previous binary: ${PREV_FILE}..."
          aws s3 cp s3://esp32-firmware-rewaa/${PREV_FILE} ./${PREV_FILE}
          
          echo "Installing detools..."
          pip install detools
          
          echo "Generating binary delta patch (${PATCH_NAME})..."
          detools create_patch -c crle ${PREV_FILE} ${CURRENT_FILE} ${PATCH_NAME}
          
          echo "Uploading patch to S3..."
          aws s3 cp ${PATCH_NAME} s3://esp32-firmware-rewaa/
          
          echo "Uploading new baseline binary to S3..."
          aws s3 cp ${CURRENT_FILE} s3://esp32-firmware-rewaa/