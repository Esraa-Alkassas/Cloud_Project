name: ESP32 Delta OTA Pipeline

on:
  push:
    branches:
      - feature/docker-env
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Build Firmware
      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: '.'

      # Step 4: Rename and Stage the Output Binary
      - name: Rename Build Output
        id: rename-step
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          NEW_FILENAME="firmware_${TIMESTAMP}.bin"
          
          echo "Moving and renaming build/wifi_station.bin to ${NEW_FILENAME}..."
          
          sudo mv build/wifi_station.bin ${NEW_FILENAME}
          sudo chown $USER:$USER ${NEW_FILENAME}
          
          echo "current_file=${NEW_FILENAME}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      # Step 5: Check S3 for Previous Firmware
      - name: Check for Previous Firmware in S3
        id: s3-check
        run: |
          echo "Looking for the latest firmware in the bucket..."
          
          LATEST_FILE=$(aws s3 ls s3://esp32-firmware-rewaa/ | grep 'firmware_.*\.bin$' | sort | tail -n 1 | awk '{print $4}')
          
          if [ -z "$LATEST_FILE" ]; then
            echo "No previous baseline binary found."
            echo "has_previous=false" >> $GITHUB_OUTPUT
          else
            echo "Found previous baseline binary: $LATEST_FILE"
            echo "has_previous=true" >> $GITHUB_OUTPUT
            echo "latest_file=$LATEST_FILE" >> $GITHUB_OUTPUT
          fi

      # Step 6: First Run - Upload Initial Baseline (No Patch)
      - name: Upload Initial Baseline to S3
        if: steps.s3-check.outputs.has_previous == 'false'
        run: |
          CURRENT_FILE="${{ steps.rename-step.outputs.current_file }}"
          echo "No previous binary found. Uploading ${CURRENT_FILE} as the new baseline..."
          aws s3 cp ${CURRENT_FILE} s3://esp32-firmware-rewaa/

          # Step 7: Setup Python (Required for detools)
      - name: Setup Python
        if: steps.s3-check.outputs.has_previous == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 8: Subsequent Run - Generate and Upload Patch
      - name: Generate and Upload Patch
        if: steps.s3-check.outputs.has_previous == 'true'
        run: |
          # 1. Retrieve variables from previous steps
          PREV_FILE="${{ steps.s3-check.outputs.latest_file }}"
          CURRENT_FILE="${{ steps.rename-step.outputs.current_file }}"
          TIMESTAMP="${{ steps.rename-step.outputs.timestamp }}"
          PATCH_NAME="patch_${TIMESTAMP}.bin"
          
          # 2. Download previous binary from S3
          echo "Downloading previous binary: ${PREV_FILE}..."
          aws s3 cp s3://esp32-firmware-rewaa/${PREV_FILE} ./${PREV_FILE}
          
          # 3. Install detools
          echo "Installing detools..."
          pip install detools
          
          # 4. Generate the CRLE patch
          echo "Generating binary delta patch (${PATCH_NAME})..."
          detools create_patch -c crle ${PREV_FILE} ${CURRENT_FILE} ${PATCH_NAME}
          
          # 5. Upload the patch to S3 (This is what the ESP32 downloads)
          echo "Uploading patch to S3..."
          aws s3 cp ${PATCH_NAME} s3://esp32-firmware-rewaa/
          
          # 6. Upload the NEW full binary to S3 (To serve as the baseline for the NEXT run)
          echo "Uploading new baseline binary to S3..."
          aws s3 cp ${CURRENT_FILE} s3://esp32-firmware-rewaa/