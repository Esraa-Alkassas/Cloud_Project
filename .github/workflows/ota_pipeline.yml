name: Development OTA Pipeline

on:
  push:
    branches:
      - feature/docker-env  # Update this to your active working branch
  workflow_dispatch:

jobs:
  build-and-patch-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 1. Inject the GitHub Run Number as the ESP32 Version
      - name: Set Firmware Version
        id: set-version
        run: |
          DEV_VERSION="${GITHUB_RUN_NUMBER}"
          echo "$DEV_VERSION" > version.txt
          echo "Building dev version: $DEV_VERSION"
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT

      # 2. Build Firmware using ESP-IDF
      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: '.'

      # 3. Rename output to match the Run Number
      - name: Rename Build Output
        run: |
          DEV_VERSION="${{ steps.set-version.outputs.dev_version }}"
          sudo mv build/wifi_station.bin build_${DEV_VERSION}.bin
          sudo chown $USER:$USER build_${DEV_VERSION}.bin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Generate Star Topology Delta Patches
      - name: Generate Direct-Jump Patches
        run: |
          LATEST_VER="${{ steps.set-version.outputs.dev_version }}"
          NEW_FILE="build_${LATEST_VER}.bin"
          
          pip install detools
          
          echo "Fetching previous baselines from S3 to generate delta patches..."
          # List all previous builds, extract just the filenames
          PREVIOUS_BUILDS=$(aws s3 ls s3://esp32-firmware-rewaa/ | grep 'build_[0-9]*\.bin$' | awk '{print $4}')
          
          if [ -z "$PREVIOUS_BUILDS" ]; then
            echo "No previous builds found in bucket. This is the first upload."
          else
            for OLD_FILE in $PREVIOUS_BUILDS; do
              aws s3 cp s3://esp32-firmware-rewaa/${OLD_FILE} ./${OLD_FILE}
              
              # Extract the old version integer (e.g., extracts "42" from "build_42.bin")
              OLD_VER=$(echo $OLD_FILE | sed -E 's/build_([0-9]+)\.bin/\1/')
              
              PATCH_NAME="patch_${OLD_VER}_to_${LATEST_VER}.bin"
              
              echo "Generating delta: Run $OLD_VER -> Run $LATEST_VER"
              detools create_patch -c crle ${OLD_FILE} ${NEW_FILE} ${PATCH_NAME}
              
              echo "Uploading $PATCH_NAME to S3..."
              aws s3 cp ${PATCH_NAME} s3://esp32-firmware-rewaa/
            done
          fi
          
          echo "Uploading new baseline $NEW_FILE to S3..."
          aws s3 cp ${NEW_FILE} s3://esp32-firmware-rewaa/