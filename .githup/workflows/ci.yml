name: CI CD pipeline

on:
  push:
    branches:
      - features_Automation_CI_CD


jobs:
  Automate:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
      uses: actions/checkout@v4

      - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

      - name: Run script
      run: python Keys.py
